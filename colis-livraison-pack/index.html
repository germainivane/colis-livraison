<!doctype html>
<html lang="fr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f2">
  <title>Colis — gestion des livraisons</title>
  <style>
    :root{--ink:#18231f;--muted:#76817b;--line:#e7eae5;--paper:#fff;--canvas:#f5f6f2;--green:#236b4e;--green-dark:#174d38;--lime:#d8f277;--amber:#f5ead0;--red:#f5e1dc;--shadow:0 14px 42px #1c30200d}
    *{box-sizing:border-box}body{margin:0;background:var(--canvas);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;gap:32px}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:750;letter-spacing:-.6px;padding:0 8px}.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--green);color:var(--lime);display:grid;place-items:center;font-size:19px}.nav-label{font-size:11px;letter-spacing:1.1px;color:#98a19b;font-weight:700;padding:0 12px;margin-bottom:8px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#69756e;padding:11px 12px;border-radius:10px;text-align:left}.nav button.active{background:#edf4ef;color:var(--green);font-weight:650}.nav .icon{width:18px;text-align:center;font-size:17px}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:20px 8px 0;color:var(--muted);font-size:12px}.profile{display:flex;align-items:center;gap:10px;margin-top:16px;color:var(--ink);font-size:13px;font-weight:600}.avatar{height:34px;width:34px;background:#e7eee8;border-radius:50%;display:grid;place-items:center;color:var(--green);font-weight:700}.main{min-width:0;padding:28px 42px 55px;max-width:1500px;width:100%;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:31px}.crumb{color:var(--muted);font-size:13px}.crumb b{color:var(--ink);font-weight:600}.top-actions{display:flex;align-items:center;gap:12px}.role-switch{background:#e9ece7;padding:4px;border-radius:10px;display:flex;gap:3px}.role-switch button{border:0;background:transparent;color:#68736d;padding:7px 11px;border-radius:7px;font-size:12px;font-weight:600}.role-switch button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px #00000012}.icon-button{border:1px solid var(--line);background:#fff;border-radius:10px;height:37px;width:38px;color:#66736c}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{color:var(--green);font-weight:700;font-size:11px;letter-spacing:1.35px;text-transform:uppercase;margin-bottom:8px}h1{font-size:30px;letter-spacing:-1.1px;margin:0;font-weight:690}h2{font-size:17px;margin:0;letter-spacing:-.3px}.subtitle{color:var(--muted);margin:7px 0 0}.date{font-size:12px;color:var(--muted);padding-bottom:4px}.button{border:0;border-radius:9px;padding:11px 15px;background:var(--green);color:white;font-weight:650;font-size:13px;box-shadow:0 3px 8px #236b4e22}.button:hover{background:var(--green-dark)}.button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.button.small{padding:8px 11px;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:23px}.metric,.panel{background:var(--paper);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.metric{padding:18px 19px}.metric-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.metric-icon{height:31px;width:31px;border-radius:9px;background:#eff5f0;display:grid;place-items:center;color:var(--green);font-size:15px}.metric-value{font-size:27px;font-weight:700;letter-spacing:-1px;margin:11px 0 3px}.metric-note{font-size:11px;color:#8a948d}.up{color:var(--green);font-weight:650}.columns{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.85fr);gap:17px}.panel{padding:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.link-button{border:0;background:none;color:var(--green);font-size:12px;font-weight:650}.table-tools{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.search{position:relative;min-width:180px;max-width:260px;flex:1}.search:before{content:"⌕";position:absolute;left:10px;top:5px;color:#8a958e;font-size:18px}.search input{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px 8px 30px;font-size:11px;outline:none}.search input:focus{border-color:#76a58b;box-shadow:0 0 0 3px #236b4e12}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 9px;font-size:11px;color:#657169}.filter.active{background:#edf4ef;color:var(--green);border-color:#dce9df}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;padding:9px 10px;color:#8b958e;font-size:10px;font-weight:650;text-transform:uppercase;letter-spacing:.65px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #eef0ed;font-size:12px}tr:last-child td{border-bottom:0}.order-id{font-weight:700;font-size:12px}.route{color:#77827b;font-size:11px;margin-top:3px}.status{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:5px 9px;font-size:10px;font-weight:650;background:#edf4ef;color:var(--green)}.status:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.status.waiting{background:var(--amber);color:#9b6c16}.status.progress{background:#e9eff7;color:#4d6f9d}.status.done{background:#edf0ed;color:#6b756e}.courier{display:flex;align-items:center;gap:8px}.courier .avatar{width:27px;height:27px;font-size:10px}.courier-name{font-size:11px;font-weight:600}.courier-state{font-size:10px;color:#8c958f;margin-top:2px}.activity{display:grid;gap:16px}.activity-item{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}.activity-icon{width:29px;height:29px;border-radius:9px;background:#eff5f0;display:grid;place-items:center;color:var(--green);font-size:13px}.activity-text{font-size:11px;color:#5f6a63;line-height:1.45}.activity-text b{color:var(--ink);font-weight:650}.activity-time{color:#9aa29c;font-size:10px;margin-top:3px}.capacity{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}.capacity-row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:9px}.capacity-row span:last-child{color:var(--muted)}.bar{height:7px;border-radius:8px;background:#edf0eb;overflow:hidden}.bar span{display:block;height:100%;width:68%;border-radius:8px;background:var(--green)}.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}.courier-banner{background:var(--green);color:#fff;border-radius:15px;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;margin-bottom:17px;position:relative;overflow:hidden}.courier-banner:after{content:"";position:absolute;width:190px;height:190px;border:1px solid #ffffff17;border-radius:50%;right:110px;top:-100px;box-shadow:0 0 0 26px #ffffff08,0 0 0 52px #ffffff06}.courier-banner .eyebrow{color:var(--lime)}.courier-banner h2{font-size:20px;margin-bottom:5px}.courier-banner p{margin:0;color:#d4e4d9;font-size:12px}.available{display:flex;align-items:center;gap:7px;font-size:11px;color:#e5eee8}.available:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px #d8f27724}.job-card{padding:16px;border:1px solid var(--line);border-radius:11px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:12px}.job-top{display:flex;gap:8px;align-items:center;margin-bottom:11px}.job-id{font-size:12px;font-weight:700}.job-age{font-size:10px;color:#89938c}.job-route{display:grid;grid-template-columns:12px 1fr;gap:7px 9px;font-size:12px}.route-dots{display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 0}.route-dots i:first-child{width:7px;height:7px;border:2px solid var(--green);border-radius:50%}.route-dots i:last-child{height:22px;border-left:1px dashed #b2bbb4}.route-dots i:nth-child(3){width:7px;height:7px;background:#a9b5ac;border-radius:50%}.job-bottom{display:flex;gap:13px;margin-top:13px;color:var(--muted);font-size:10px}.job-bottom b{color:var(--ink)}.job-actions{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between}.payout{font-size:13px;font-weight:700}.payout small{font-size:10px;color:var(--muted);font-weight:500}.delivery-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:17px}.delivery-cards .metric{padding:15px 17px}.delivery-cards .metric-value{font-size:24px;margin:7px 0 0}.modal-backdrop{display:none;position:fixed;inset:0;background:#15251f77;z-index:5;align-items:center;justify-content:center;padding:18px}.modal-backdrop.open{display:flex}.modal{background:#fff;border-radius:15px;width:min(500px,100%);padding:23px;box-shadow:0 24px 80px #101b1740}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.close{border:0;background:none;font-size:22px;color:#758078}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:650;color:#626e66}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 11px;font-size:12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#76a58b;box-shadow:0 0 0 3px #236b4e12}.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;bottom:22px;right:22px;background:#17251e;color:#fff;padding:12px 16px;border-radius:9px;font-size:12px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:9}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:1050px){.shell{grid-template-columns:210px 1fr}.main{padding:25px 25px}.metrics{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.sidebar{padding:24px 13px}}
    @media(max-width:680px){.shell{display:block}.sidebar{height:62px;position:sticky;top:0;z-index:3;padding:12px 15px;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;align-items:center;justify-content:space-between}.brand{font-size:18px}.brand-mark{width:31px;height:31px}.sidebar .nav-label,.sidebar .nav,.side-bottom{display:none}.main{padding:21px 15px 40px}.topbar{margin-bottom:24px}.crumb{display:none}.top-actions{margin-left:auto}.role-switch button{padding:7px 8px;font-size:11px}.heading{align-items:flex-start;flex-direction:column;gap:14px}h1{font-size:26px}.date{display:none}.metrics{gap:9px}.metric{padding:14px}.metric-value{font-size:23px}.metric-top{font-size:11px}.metric-icon{width:27px;height:27px}.panel{padding:15px}.panel-head{align-items:flex-start;gap:12px;flex-direction:column}.filters{flex-wrap:wrap}.courier-banner{padding:18px}.courier-banner:after{right:-40px}.delivery-cards{gap:9px}.job-card{grid-template-columns:1fr}.job-actions{flex-direction:row;align-items:center}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
  </style>
  <style>
    .assign-select{max-width:130px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:7px 8px;font-size:11px;color:var(--ink)}
    .team-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .team-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:19px;box-shadow:var(--shadow)}
    .team-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}
    .avatar.large{height:44px;width:44px;font-size:13px}
    .team-card h2{margin-bottom:5px}
    .team-card-foot{border-top:1px solid var(--line);margin-top:17px;padding-top:13px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px}
    .mission-card{padding:17px;border:1px solid var(--line);border-radius:11px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:15px}
    .job-top{flex-wrap:wrap}
    .mission-action{display:flex;align-items:flex-end;justify-content:flex-end}
    .courier-columns{grid-template-columns:minmax(0,1.45fr) minmax(260px,.8fr)}
    .heading h1{line-height:1.2}
    @media(max-width:680px){.team-grid{grid-template-columns:1fr}.mission-card{grid-template-columns:1fr}.mission-action{justify-content:flex-start}.courier-columns{grid-template-columns:1fr}.table-tools{align-items:flex-start;flex-direction:column}.search{max-width:none;width:100%}.assign-select{max-width:115px}}
  </style>
  <style>
    .auth-mode .sidebar,.auth-mode .topbar{display:none}
    .auth-mode .shell{display:block;min-height:100vh;background:#f5f6f2}
    .auth-mode .main{max-width:1200px;padding:30px 24px;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .login-wrap{width:100%;max-width:1030px;min-height:620px;display:grid;grid-template-columns:1fr .88fr;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 25px 80px #17251e12}
    .login-card{padding:54px clamp(30px,6vw,76px);display:flex;flex-direction:column;justify-content:center}
    .login-brand{display:flex;align-items:center;gap:11px;font-weight:750;font-size:21px;letter-spacing:-.5px;margin-bottom:42px}
    .login-card .eyebrow{margin-bottom:8px}.login-card h1{font-size:28px;letter-spacing:-.9px}.login-card>.subtitle{font-size:13px;margin:9px 0 23px;max-width:360px}
    .login-tabs{display:grid;grid-template-columns:1fr 1fr;background:#f0f2ee;padding:4px;border-radius:9px;margin-bottom:21px}
    .login-tabs button{border:0;border-radius:7px;padding:9px;color:var(--muted);background:transparent;font-size:12px;font-weight:650}
    .login-tabs button.active{background:#fff;color:var(--green);box-shadow:0 1px 4px #17251e12}
    #loginForm{display:grid;gap:15px}.login-meta{display:flex;justify-content:space-between;align-items:center;margin-top:-3px;font-size:11px;color:var(--muted)}.login-meta label{display:flex;gap:6px;align-items:center}.login-meta a,.login-foot a{color:var(--green);font-weight:650;text-decoration:none}.login-submit{width:100%;margin-top:2px;padding:12px}
    .login-foot{text-align:center;margin-top:18px;color:var(--muted);font-size:12px}.demo-note{margin-top:22px;background:#f6f7f4;border:1px solid var(--line);border-radius:9px;padding:11px 13px;color:#727d76;font-size:10px;line-height:1.5}.demo-note b{color:#435249}
    .login-side{background:var(--green);padding:50px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;position:relative;overflow:hidden}.login-side:after{content:"";position:absolute;width:440px;height:440px;border:1px solid #ffffff20;border-radius:50%;right:-150px;bottom:40px;box-shadow:0 0 0 34px #ffffff0c,0 0 0 68px #ffffff08,0 0 0 102px #ffffff05}.login-side-copy,.login-side-foot{position:relative;z-index:1}.login-side .eyebrow{color:var(--lime)}.login-side h2{font-size:40px;line-height:1.12;letter-spacing:-1.5px;margin:14px 0}.login-side p{color:#d6e6dc;font-size:13px;max-width:250px}.login-side-foot{font-size:10px;color:#c3d7ca}
    @media(max-width:760px){.auth-mode .main{padding:16px}.login-wrap{display:block;min-height:0;max-width:480px}.login-card{padding:28px 24px}.login-brand{margin-bottom:25px}.login-side{display:none}.auth-mode .shell{background:#f5f6f2}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">↗</span> colis<span style="color:var(--green)">.</span></div>
      <div><div class="nav-label">ESPACE</div><nav class="nav" id="sideNav"></nav></div>
      <div class="side-bottom">Centre d’aide<br>Besoin d’un coup de main ?<div class="profile"><div class="avatar">AM</div><div id="profileName">Aïcha Mensah<br><span style="color:#8b958e;font-size:11px;font-weight:400">Administratrice</span></div></div></div>
    </aside>
    <main class="main">
      <div class="topbar"><div class="crumb">Gestion des opérations　/　<b id="crumbLabel">Vue d’ensemble</b></div><div class="top-actions"><div class="role-switch"><span class="role-label" id="roleLabel"></span></div><button class="button secondary small" id="logoutButton">Se déconnecter</button></div></div>
      <div id="app"></div>
    </main>
  </div>
  <div class="modal-backdrop" id="modalBackdrop"><section class="modal"><div class="modal-head"><h2>Créer une livraison</h2><button class="close" id="closeModal" aria-label="Fermer">×</button></div><form id="deliveryForm"><div class="form-grid"><div class="field"><label>Nom du destinataire</label><input name="recipient" required placeholder="Ex. Koffi Yao"></div><div class="field"><label>Téléphone</label><input name="phone" required placeholder="+225 07 00 00 00 00"></div><div class="field full"><label>Adresse de collecte</label><input name="pickup" required placeholder="Quartier, rue, repère"></div><div class="field full"><label>Adresse de livraison</label><input name="dropoff" required placeholder="Quartier, rue, repère"></div><div class="field"><label>Type de colis</label><select name="parcel"><option>Petit colis</option><option>Document</option><option>Colis standard</option><option>Colis volumineux</option></select></div><div class="field"><label>Livreur</label><select name="courier"><option value="À attribuer">À attribuer</option><option value="K. Kouassi">K. Kouassi</option><option value="M. Traoré">M. Traoré</option><option value="A. Diallo">A. Diallo</option></select></div></div><div class="modal-footer"><button type="button" class="button secondary" id="cancelModal">Annuler</button><button class="button">Enregistrer la livraison</button></div></form></section></div>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
